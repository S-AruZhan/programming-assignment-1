<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Balance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Hydration Calculator</h1>
        <p>Find out your individual water intake for the day.</p>

        <div class="form-group">
            <label for="userName">Your name:</label>
            <input type="text" id="userName" placeholder="Enter a name">
        </div>

        <div class="form-group">
            <label for="weight">Weight (kg):</label>
            <input type="number" id="weight" placeholder="For example: 70">
        </div>

        <div class="form-group">
            <label for="activity">Activity (minutes of sports per day):</label>
            <input type="number" id="activity" placeholder="For example: 60">
        </div>

        <button onclick="calculateWater()">Calculate the rate</button>

        <div id="result" class="result-box" style="display: none;">
            <h2 id="greeting"></h2>
            <p id="calculationText"></p>
            <p id="categoryText" class="status-badge"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
