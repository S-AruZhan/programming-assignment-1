<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Balance Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Калькулятор гидратации</h1>
        <p>Узнайте свою индивидуальную норму воды на день.</p>
        
        <div class="form-group">
            <label for="userName">Ваше имя:</label>
            <input type="text" id="userName" placeholder="Введите имя">
        </div>

        <div class="form-group">
            <label for="weight">Вес (кг):</label>
            <input type="number" id="weight" placeholder="Например: 70">
        </div>

        <div class="form-group">
            <label for="activity">Активность (минут спорта в день):</label>
            <input type="number" id="activity" placeholder="Например: 60">
        </div>

        <button onclick="calculateWater()">Рассчитать норму</button>

        <div id="result" class="result-box" style="display: none;">
            <h2 id="greeting"></h2>
            <p id="calculationText"></p>
            <p id="categoryText" class="status-badge"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
